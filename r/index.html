<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Monitor de Ofertas ML — abrindo oferta…</title>
<meta property="og:title" content="Monitor de Ofertas ML">
<meta property="og:description" content="Oferta selecionada — abrindo no Mercado Livre">
<meta property="og:image" content="https://www.monitorofertas.com.br/og.jpg">
<style>
  body{font-family:system-ui,sans-serif;background:#0e1116;color:#dfe3ea;display:flex;
       align-items:center;justify-content:center;min-height:100vh;margin:0}
  .box{text-align:center;padding:24px;max-width:340px}
  a{color:#5aa9ff}
  .spin{width:28px;height:28px;border:3px solid #2a3140;border-top-color:#ffd700;
        border-radius:50%;margin:0 auto 14px;animation:g .8s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  #escolha{display:none}
  .btn-app{display:block;background:#f5b800;color:#0d1b2e;font-weight:800;
           text-decoration:none;padding:15px 20px;border-radius:12px;font-size:1.05rem}
  .btn-site{display:inline-block;margin-top:16px;font-size:.92rem}
</style>
</head>
<body>
<div class="box">
  <div id="carregando">
    <div class="spin"></div>
    <div>Abrindo a oferta…</div>
    <div style="margin-top:10px;font-size:.9rem"><a id="fallback" href="https://www.monitorofertas.com.br">ir manualmente</a></div>
  </div>
  <!-- Só aparece quando o app não pôde ser aberto por script (PWA instalada /
       WebView): o Chrome exige TOQUE do usuário pra lançar intent://. -->
  <div id="escolha">
    <a id="btnApp" class="btn-app" href="#">🛒 Abrir no app da Amazon</a>
    <a id="btnSite" class="btn-site" href="https://www.monitorofertas.com.br">Continuar no site →</a>
  </div>
</div>
<script>
// Redirect rastreável multi-loja. DOIS formatos de entrada:
//
//   COMPACTO (atual, o que a gente envia):
//     /r/?A-<ASIN>-<canal>              Amazon   → /r/?A-B0BP2TGK6W-k
//     /r/?M-<id>-<MLB>-<canal>          ML       → /r/?M-1zaYcYa-MLB46013144-f
//     /r/?M-<id>-<canal>                ML sem MLB (3 partes)
//   LONGO (legado): /r/?to=<id>&o=<MLB>&c=<canal>&mkt=<ml|amz>
//
// O legado FICA PRA SEMPRE: as mensagens já enviadas no WhatsApp apontam pra ele
// e continuam clicáveis anos depois. O compacto só encurta o que sai daqui pra
// frente (~12 chars a menos e sem "&" no meio, que suja a prévia do WhatsApp).
//
// O que a página faz: 1) conta o clique no GA4; 2) redireciona pro link de
// AFILIADO da loja certa:
//      ML   (default): meli.la/<id>
//      amz  (Amazon):  amazon.com.br/dp/<ASIN>?tag=...  (a tag mora AQUI, não na
//                      URL curta — link branded e a comissão fica escondida).
// Whitelist por loja → nunca vira redirecionador aberto.
(function () {
  var AMZ_TAG = 'monitorofer03-20';
  var to = '', mkt = 'ml', canal = '', mlb = '';

  // "?A-B0BP2TGK6W-k" → query sem "=" nenhum. Não usa PATH (/r/A-...) porque o
  // site é GitHub Pages: path inexistente cai no 404 (status 404 de verdade).
  var bruto = decodeURIComponent((location.search || '').replace(/^\?/, ''));
  var comp = /^([AM])-([A-Za-z0-9]{4,16})(?:-([A-Za-z0-9]{3,20}))?(?:-([a-z]{1,10}))?$/.exec(bruto);
  if (comp && bruto.indexOf('=') === -1) {
    mkt = comp[1] === 'A' ? 'amz' : 'ml';
    to = comp[2];
    // 3 partes → o 3º campo é o CANAL; 4 partes → é o MLB e o 4º é o canal.
    if (comp[4]) { mlb = comp[3] || ''; canal = comp[4]; }
    else { canal = (comp[3] || '').toLowerCase(); }
    if (mkt === 'amz') { mlb = to; canal = canal || ''; }
  } else {
    var q = new URLSearchParams(location.search);
    to = (q.get('to') || '').trim();
    mkt = (q.get('mkt') || 'ml').toLowerCase();
    canal = (q.get('c') || '').slice(0, 10);
    mlb = (q.get('o') || '').trim();
  }

  var dest = 'https://www.monitorofertas.com.br';
  if (mkt === 'amz') {
    // ASIN = 10 chars [A-Z0-9]. ascsubtag rastreia o canal no painel da Amazon.
    if (/^[A-Z0-9]{10}$/.test(to)) {
      dest = 'https://www.amazon.com.br/dp/' + to + '?tag=' + AMZ_TAG +
             '&language=pt_BR' + (canal ? '&ascsubtag=' + encodeURIComponent(canal) : '');
    }
  } else if (/^[A-Za-z0-9]{4,16}$/.test(to)) {
    dest = 'https://meli.la/' + to;
  }
  var ok = dest.indexOf('monitorofertas.com.br') === -1;
  document.getElementById('fallback').href = dest;

  // Consentimento: MESMA chave do banner do site (localStorage `mo_consent`, mesma
  // origem). '0' = o visitante NEGOU → não medimos nada, só redirecionamos. Antes
  // esta página media sempre, ignorando a escolha feita no site.
  var consent = null;
  try { consent = localStorage.getItem('mo_consent'); } catch (e) { /* modo restrito */ }
  var podeMedir = consent !== '0';
  var podeGravar = consent === '1';   // storage só com SIM explícito (LGPD)

  // cid: REAPROVEITA o do site quando existe (cookie _ga do próprio domínio) — aí o
  // clique cai no MESMO usuário que navegou o site. E, com consentimento, GRAVA o
  // cookie: sem isso cada clique inventava um cid e virava um "usuário" novo (em 28
  // dias o GA marcou 869 cliques e 857 "usuários" — ratio 1,00, tudo fantasma).
  // Quem só clica no WhatsApp e nunca aceitou o banner segue anônimo de propósito:
  // identificá-lo exigiria gravar storage sem consentimento.
  var cid = '', sid = '';
  try {
    var ck = document.cookie || '';
    var m = /(?:^|;\s*)_ga=GA\d\.\d\.([\d.]+)/.exec(ck);
    if (m) cid = m[1];
    // _ga_<ID> guarda a SESSÃO ativa: "GS1.1.<session_id>.<n>..." — reusando o
    // session_id, o clique entra na MESMA sessão do site, não numa solta.
    var s = /(?:^|;\s*)_ga_6959NQX27C=GS\d\.\d\.(\d+)/.exec(ck);
    if (s) sid = s[1];
  } catch (e) { /* sem cookie → anônimo */ }
  var cidNovo = !cid;
  if (!cid) cid = Math.floor(Math.random() * 1e10) + '.' + Math.floor(Date.now() / 1000);
  if (!sid) sid = String(Math.floor(Date.now() / 1000));
  // Persiste no formato do próprio GA (GA1.1.<cid>), 1º-party, 2 anos: o próximo
  // clique — e a visita ao site — reconhecem a MESMA pessoa.
  if (podeGravar && cidNovo) {
    try {
      document.cookie = '_ga=GA1.1.' + cid + '; path=/; max-age=63072000; SameSite=Lax; Secure';
    } catch (e) { /* cookie bloqueado → segue anônimo */ }
  }
  // oferta = id do produto. ML: o MLB; sem MLB na URL, cai no id do meli.la (100
  // cliques iam com a dimensão VAZIA). Amazon: o próprio ASIN.
  var oferta = (mlb || to || '').slice(0, 30);

  function ga(evento, extras) {
    if (!ok || !podeMedir) return;
    try {
      var p = new URLSearchParams({
        v: '2', tid: 'G-6959NQX27C', cid: cid, en: evento,
        sid: sid,                       // sem sid o evento não entra em sessão nenhuma
        dl: location.href, dt: 'redirect',
        'ep.oferta': oferta,
        'ep.canal': canal,
        'ep.mkt': mkt,
        'ep.link': to
      });
      for (var k in (extras || {})) p.set('ep.' + k, extras[k]);
      // sendBeacon sobrevive à navegação — não precisamos esperar resposta.
      navigator.sendBeacon('https://www.google-analytics.com/g/collect?' + p.toString());
    } catch (e) { /* contagem é best-effort; redirect nunca espera por ela */ }
  }

  // Clique da oferta: contado SEMPRE, no load, antes de qualquer branch — o
  // caminho (app automático, botão, site) não muda a contagem do painel.
  ga('click_oferta');

  // ── Abrir o APP da Amazon no celular (deep link + fallback) ────────────────
  // Universal/App Links só disparam no TOQUE em domínio associado — nunca num
  // redirect nosso. Então no mobile tentamos o app explicitamente. O QUE ABRE o
  // link manda no que funciona:
  //   • navegador de verdade / Custom Tab → intent:// resolve e abre o app;
  //   • WebView in-app (o "navegador" do WhatsApp) → intent:// é ENGOLIDO em
  //     silêncio, mas custom scheme costuma passar (o host delega pro Android).
  // Daí duas tentativas encadeadas no Android (era só intent://, e quem caía no
  // WebView ia sempre pro site). iOS já usava o scheme. A tag de afiliado vai
  // dentro da URL nos dois caminhos.
  var ua = navigator.userAgent || '';
  var eAmz = ok && mkt === 'amz';
  var amzQS = '?tag=' + AMZ_TAG + '&language=pt_BR' +
              (canal ? '&ascsubtag=' + encodeURIComponent(canal) : '');
  var amzScheme = 'com.amazon.mobile.shopping.web://amazon.com.br/dp/' + to + amzQS;

  // Navega sem depender de location.replace: WebView que ignora replace() em
  // scheme não-http muitas vezes honra o clique num <a> (parece gesto real).
  function irPara(url) {
    try {
      var a = document.createElement('a');
      a.href = url;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
    } catch (e) { location.href = url; }
  }

  if (eAmz && /Android/i.test(ua)) {
    var intent = 'intent://www.amazon.com.br/dp/' + to + amzQS +
      '#Intent;scheme=https;package=com.amazon.mShop.android.shopping;' +
      'S.browser_fallback_url=' + encodeURIComponent(dest) + ';end';

    // Tela de escolha: o Chrome SÓ lança intent:// por script quando a página
    // tem "user activation". Sem toque (nosso caso: chegamos por redirect), ele
    // BLOQUEIA — é o que acontece na PWA instalada (manifest scope "/" faz a
    // WebAPK capturar monitorofertas.com.br/r/) e em WebView in-app. O toque no
    // botão é ativação de verdade → o intent passa e o app abre. Quem não tem o
    // app cai no browser_fallback_url do próprio intent (= site com a tag).
    var mostrarEscolha = function (motivo) {
      var bApp = document.getElementById('btnApp');
      var bSite = document.getElementById('btnSite');
      bApp.href = intent;
      bSite.href = dest;
      // rastreio do desfecho: quantos VÊEM a tela (auto bloqueado) e quantos
      // de fato tocam em cada botão — é como medimos se o app está abrindo.
      ga('escolha_app', { via: motivo });
      bApp.addEventListener('click', function () { ga('abrir_app', { via: motivo }); });
      bSite.addEventListener('click', function () { ga('abrir_site', { via: motivo }); });
      document.getElementById('carregando').style.display = 'none';
      document.getElementById('escolha').style.display = 'block';
    };
    // PWA/standalone: o auto é bloqueado na certa — não perde 2s piscando spinner.
    var standalone = false;
    try {
      standalone = (window.matchMedia &&
                    window.matchMedia('(display-mode: standalone)').matches) ||
                   navigator.standalone === true;
    } catch (e) { /* sem matchMedia → segue o caminho automático */ }
    if (standalone) { mostrarEscolha('pwa'); return; }

    // Navegador normal: 1ª tentativa intent:// (abre o app direto), 2ª o scheme
    // (WebView costuma barrar intent mas deixar passar custom scheme). Nenhuma
    // pegou → tela de escolha (NÃO manda pro site sozinho: aqui o auto foi
    // bloqueado, então quem tem o app merece o botão).
    var t2 = setTimeout(function () { irPara(amzScheme); }, 700);
    var t3 = setTimeout(function () { mostrarEscolha('auto_falhou'); }, 2000);
    var cancelar = function () { clearTimeout(t2); clearTimeout(t3); };
    // página sumiu = o app abriu → aborta o resto (nada por cima)
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) cancelar();
    });
    window.addEventListener('pagehide', cancelar);
    irPara(intent);
    return;
  }
  if (eAmz && /iPhone|iPad|iPod/i.test(ua)) {
    var timer = setTimeout(function () { location.replace(dest); }, 1400);
    // app abriu → página foi pro background → não navega pro site por cima
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) clearTimeout(timer);
    });
    window.addEventListener('pagehide', function () { clearTimeout(timer); });
    location.href = amzScheme;
    return;
  }
  location.replace(dest);
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=https://www.monitorofertas.com.br"></noscript>
</body>
</html>
